<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Sanity Check</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #info {
      position: fixed; top: 10px; left: 10px; right: 10px;
      background: rgba(0,0,0,0.7); color: white; padding: 10px;
      border-radius: 6px; font-size: 14px; text-align: center; z-index: 9999;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <div id="info">
    <b>【動作確認用】</b> カメラの正面2mにモデルを表示中。<br>映らない場合はBlenderのスケールやファイル名を確認してください。
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- カメラのすぐ目の前（Z=-2m）にモデルを固定配置 -->
    <a-entity position="0 0 -2" scale="1 1 1" rotation="0 0 0">
      <a-gltf-model src="./model.glb"></a-gltf-model>
    </a-entity>

    <a-camera-static />
  </a-scene>

</body>
</html>
