<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TREND-CORE Plane Rectangular Coordinates AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js'></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #info-panel {
      position: fixed; top: 10px; left: 10px; right: 10px;
      background: rgba(0,0,0,0.8); color: white; padding: 12px;
      border-radius: 8px; font-size: 13px; z-index: 9999; pointer-events: none;
      line-height: 1.4;
    }
    #control-panel {
      position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9); padding: 10px; border-radius: 12px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; z-index: 9999;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 92%; max-width: 350px;
    }
    .ctrl-btn {
      padding: 10px 5px; font-size: 12px; font-weight: bold; background: #0066cc;
      color: white; border: none; border-radius: 6px; text-align: center; cursor: pointer;
      pointer-events: auto;
    }
    .ctrl-btn:active { background: #004080; }
    .label-cell { font-size: 10px; color: #333; text-align: center; grid-column: span 3; margin-top: 4px; }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <div id="info-panel">
    <b>【平面直角座標 入力AR】</b><br>
    <span id="status-text">座標を計算中...</span>
  </div>

  <!-- 微調整用コントロールパネル -->
  <div id="control-panel">
    <button class="ctrl-btn" onclick="adjustPosition(0, 0, -0.1)">前進</button>
    <button class="ctrl-btn" onclick="adjustPosition(0, 0.1, 0)">標高+ (上)</button>
    <button class="ctrl-btn" onclick="adjustPosition(0, 0, 0.1)">後退</button>
    <button class="ctrl-btn" onclick="adjustPosition(-0.1, 0, 0)">左移動</button>
    <button class="ctrl-btn" onclick="adjustRotation(5)">回転 (+)</button>
    <button class="ctrl-btn" onclick="adjustPosition(0.1, 0, 0)">右移動</button>
    <button class="ctrl-btn" onclick="resetModel()">位置リセット</button>
    <button class="ctrl-btn" onclick="adjustPosition(0, -0.1, 0)">標高- (下)</button>
    <button class="ctrl-btn" onclick="adjustRotation(-5)">回転 (-)</button>
    <div class="label-cell">※ボタンで位置・向きの微調整が可能</div>
  </div>

  <!-- A-Frame シーン -->
  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; gpsCameraMinDistance: 1;">

    <a-entity
      id="ar-model"
      scale="1 1 1"
      rotation="0 0 0"
      position="0 0 0">
      <a-gltf-model src="./model.glb" animation-mixer></a-gltf-model>
    </a-entity>

    <a-camera gps-new-camera="gpsMinAccuracy: 20"></a-camera>
  </a-scene>

  <script>
    // ─── 【ここに現場の数値を直接入力してください】 ───
    const SURVEY_INPUT = {
      zone: 3,             // 例: 山口・島根・広島なら 「3」（第3系）
      targetX: -32444,   // 配置したい位置の X 座標 (南北方向の数値)
      targetY: -215002    // 配置したい位置の Y 座標 (東西方向の数値 ※500000〜の値をそのまま入力)
    };

    // 日本の平面直角座標系 第1系〜第19系の原点定義（緯度・中央経子午線経度）
    const ZONE_ORIGINS = {
      1:  { lat: 33.0, lon: 129.5 },
      2:  { lat: 33.0, lon: 131.0 },
      3:  { lat: 36.0, lon: 132.1666667 }, // 第3系 (山口・島根・広島)
      4:  { lat: 33.0, lon: 133.5 },
      5:  { lat: 36.0, lon: 134.3333333 },
      6:  { lat: 36.0, lon: 136.0 },
      7:  { lat: 36.0, lon: 137.1666667 },
      8:  { lat: 36.0, lon: 138.5 },
      9:  { lat: 36.0, lon: 139.8333333 },
      10: { lat: 40.0, lon: 140.8333333 },
      11: { lat: 44.0, lon: 140.25 },
      12: { lat: 44.0, lon: 142.25 },
      13: { lat: 44.0, lon: 144.25 },
      14: { lat: 26.0, lon: 142.0 },
      15: { lat: 26.0, lon: 127.5 },
      16: { lat: 26.0, lon: 124.0 },
      17: { lat: 26.0, lon: 131.0 },
      18: { lat: 20.0, lon: 136.0 },
      19: { lat: 26.0, lon: 154.0 }
    };

    // 平面直角座標（X, Y）を緯度・経度に変換する関数（Yの500kmオフセット自動考慮）
    function convertXYToLatLng(zoneNo, x, y) {
      const origin = ZONE_ORIGINS[zoneNo];
      if (!origin) {
        alert('指定された系番号が無効です。');
        return { latitude: 35.68123, longitude: 139.76712 };
      }

      // Xは北方向(+), Yは東方向(+) ※Yは500,000mの仮東座標を引く
      const dx = x;
      const dy = y - 500000.0;

      const dLat = dx / 111000.0;
      const dLng = dy / (111000.0 * Math.cos(origin.lat * Math.PI / 180.0));

      return {
        latitude: origin.lat + dLat,
        longitude: origin.lon + dLng
      };
    }

    // 読み込み時に自動計算してモデルに適用
    window.addEventListener('DOMContentLoaded', () => {
      const latLng = convertXYToLatLng(SURVEY_INPUT.zone, SURVEY_INPUT.targetX, SURVEY_INPUT.targetY);
      const modelEl = document.getElementById('ar-model');

      modelEl.setAttribute('gps-new-entity-place', {
        latitude: latLng.latitude,
        longitude: latLng.longitude
      });

      document.getElementById('status-text').innerHTML = `
        第${SURVEY_INPUT.zone}系 / X:${SURVEY_INPUT.targetX}, Y:${SURVEY_INPUT.targetY}<br>設定完了。現場で微調整してください。
      `;
    });

    // 微調整用スクリプト
    const modelEl = document.getElementById('ar-model');
    function adjustPosition(dx, dy, dz) {
      const pos = modelEl.getAttribute('position');
      modelEl.setAttribute('position', { x: pos.x + dx, y: pos.y + dy, z: pos.z + dz });
    }
    function adjustRotation(ddeg) {
      const rot = modelEl.getAttribute('rotation');
      modelEl.setAttribute('rotation', { x: rot.x, y: rot.y + ddeg, z: rot.z });
    }
    function resetModel() {
      modelEl.setAttribute('position', {x: 0, y: 0, z: 0});
      modelEl.setAttribute('rotation', {x: 0, y: 0, z: 0});
    }
  </script>
</body>
</html>
