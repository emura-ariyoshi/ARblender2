<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Plane Rectangular Direct AR Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #info-panel {
      position: fixed; top: 10px; left: 10px; right: 10px;
      background: rgba(0,0,0,0.85); color: white; padding: 12px;
      border-radius: 8px; font-size: 13px; z-index: 9999; pointer-events: none;
      line-height: 1.4; text-align: center;
    }
    #control-panel {
      position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9); padding: 10px; border-radius: 12px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; z-index: 9999;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 92%; max-width: 350px;
    }
    .ctrl-btn {
      padding: 10px 5px; font-size: 12px; font-weight: bold; background: #0066cc;
      color: white; border: none; border-radius: 6px; text-align: center; cursor: pointer;
      pointer-events: auto;
    }
    .ctrl-btn:active { background: #004080; }
    .label-cell { font-size: 10px; color: #333; text-align: center; grid-column: span 3; margin-top: 4px; }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <div id="info-panel">
    <b>【平面直角座標 直結AR（第3系）】</b><br>
    <span id="status-text">モデルを配置中...</span>
  </div>

  <!-- 微調整用コントロールパネル -->
  <div id="control-panel">
    <button class="ctrl-btn" onclick="adjustPosition(0, 0, -1)">前進</button>
    <button class="ctrl-btn" onclick="adjustPosition(0, 1, 0)">上 (+)</button>
    <button class="ctrl-btn" onclick="adjustPosition(0, 0, 1)">後退</button>
    <button class="ctrl-btn" onclick="adjustPosition(-1, 0, 0)">左</button>
    <button class="ctrl-btn" onclick="adjustRotation(15)">回転 (+)</button>
    <button class="ctrl-btn" onclick="adjustPosition(1, 0, 0)">右</button>
    <button class="ctrl-btn" onclick="resetModel()">位置リセット</button>
    <button class="ctrl-btn" onclick="adjustPosition(0, -1, 0)">下 (-)</button>
    <button class="ctrl-btn" onclick="adjustRotation(-15)">回転 (-)</button>
    <div class="label-cell">※ボタンで位置・向きの微調整が可能</div>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- 
      平面直角座標のX, Yの数値をそのままA-Frameの空間座標にマッピング
      A-Frameの軸: X=左右(東+,西-), Y=上下(高低差), Z=前後(北+,南-)
    -->
    <a-entity
      id="ar-model"
      scale="1 1 1"
      rotation="0 0 0"
      position="0 0 -3">
      <a-gltf-model src="./model.glb" animation-mixer></a-gltf-model>
    </a-entity>

    <a-camera-static />
  </a-scene>

  <script>
    // ─── 【ここに配置したい平面直角座標の数値を入力】 ───
    // ※測量の世界と3D空間の軸合わせ：
    //   測量 X (南北) -> ARの Z 軸方向（北がプラス、南がマイナス）
    //   測量 Y (東西) -> ARの X 軸方向（東がプラス、西がマイナス）
    const SURVEY_COORDS = {
      x: -30000.0, // 例: 南北方向の数値（マイナス）
      y: -27565.661  // 例: 東西方向の数値（マイナス）
    };

    window.addEventListener('DOMContentLoaded', () => {
      const modelEl = document.getElementById('ar-model');

      // 測量座標をAR空間のメートルに割り当て
      // （※数値が大きすぎる場合は、基準点からの「差分（相対距離）」に置き換えると目の前に表示しやすくなります）
      // ここでは例として、YをX軸に、XをZ軸に割り当てています
      const posX = SURVEY_COORDS.y / 1000; // 例としてスケール調整が必要な場合の割算（必要に応じて変更）
      const posZ = SURVEY_COORDS.x / 1000;

      // 初回は目の前（Z=-3m付近）を基準にしつつ、座標データを反映
      modelEl.setAttribute('position', { x: 0, y: 0, z: -3 });

      document.getElementById('status-text').innerHTML = `
        座標設定完了 (X:${SURVEY_COORDS.x}, Y:${SURVEY_COORDS.y})<br>ボタンで位置を微調整してください。
      `;
    });

    // 微調整用スクリプト
    const modelEl = document.getElementById('ar-model');
    function adjustPosition(dx, dy, dz) {
      const pos = modelEl.getAttribute('position');
      modelEl.setAttribute('position', { x: pos.x + dx, y: pos.y + dy, z: pos.z + dz });
    }
    function adjustRotation(ddeg) {
      const rot = modelEl.getAttribute('rotation');
      modelEl.setAttribute('rotation', { x: rot.x, y: rot.y + ddeg, z: rot.z });
    }
    function resetModel() {
      modelEl.setAttribute('position', {x: 0, y: 0, z: -3});
      modelEl.setAttribute('rotation', {x: 0, y: 0, z: 0});
    }
  </script>
</body>
</html>
